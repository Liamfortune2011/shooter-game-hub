<!-- LOCK SCREEN -->
<div id="lock-overlay">
  <div class="lock-box">
    <span class="lock-emoji">🔒</span>
    <h2>Game Hub</h2>
    <p>Enter access code to continue</p>

    <input
      id="lock-input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      autocomplete="off"
      placeholder="------"
    >

    <button id="lock-submit">Unlock</button>

    <div id="lock-msg"></div>
    <div id="lock-hint">Codes are 4–6 digits</div>
  </div>
</div>

<style>
#lock-overlay {
  position: fixed;
  inset: 0;
  background: var(--app-bg);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#lock-overlay.hidden {
  display: none;
}

.lock-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 2rem 1.75rem;
  width: min(88vw, 340px);
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}

.lock-box .lock-emoji {
  font-size: 34px;
  display: block;
  margin-bottom: 10px;
}

.lock-box h2 {
  font-size: 18px;
  font-weight: 600;
  margin: 0 0 6px;
}

.lock-box p {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 1.25rem;
}

#lock-input {
  width: 100%;
  text-align: center;
  font-size: 20px;
  letter-spacing: 8px;
  font-family: "Courier New", monospace;
  padding: 12px 8px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--hover-bg);
  color: var(--app-text);
  outline: none;
}

#lock-input:focus {
  border-color: var(--app-text);
}

#lock-submit {
  margin-top: 1rem;
  width: 100%;
  font-weight: 600;
  background: var(--app-text);
  color: var(--app-bg);
  border-color: var(--app-text);
}

#lock-submit:hover {
  opacity: 0.85;
}

#lock-msg {
  font-size: 13px;
  color: var(--danger);
  margin-top: 10px;
  min-height: 18px;
}

#lock-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 14px;
}
</style>

<script>
(function () {
  var ACCOUNTS = {
    "061386": "ForceFortune"
  };

  var overlay;
  var input;
  var msgEl;

  function tryUnlock() {
    var code = (input.value || "").trim();
    var user = ACCOUNTS[code];

    msgEl.textContent = "";

    if (user) {
      localStorage.setItem("gamehub_account_code", code);
      localStorage.setItem("gamehub_account_username", user);

      window.gameHubAccountCode = code;
      window.gameHubAccountUsername = user;

      overlay.classList.add("hidden");
      input.value = "";

      return;
    }

    msgEl.textContent = "Incorrect code";
    input.value = "";
    input.focus();
  }

  document.addEventListener("DOMContentLoaded", function () {
    overlay = document.getElementById("lock-overlay");
    input = document.getElementById("lock-input");
    msgEl = document.getElementById("lock-msg");

    var savedCode = localStorage.getItem("gamehub_account_code");
    var savedUser = localStorage.getItem("gamehub_account_username");

    if (savedCode && savedUser && ACCOUNTS[savedCode] === savedUser) {
      window.gameHubAccountCode = savedCode;
      window.gameHubAccountUsername = savedUser;
      overlay.classList.add("hidden");
    }

    document.getElementById("lock-submit").addEventListener("click", function (e) {
      e.preventDefault();
      tryUnlock();
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        tryUnlock();
      }
    });
  });
})();
</script>
